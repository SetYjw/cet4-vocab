<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>四级进阶词卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered working column — stats strip, mode tabs, scope bar, then a single surface (index card / quiz / word table) */
:root{
  --bg:#eef1f4; --surface:#fbfcfd; --ink:#18212b; --muted:#5b6977; --line:#d3dae2;
  --accent:#2348c7; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --mark:#ffe36e; --mark-ink:#18212b;
  --bad:#b83a2a; --bad-bg:#fbe8e4; --mid:#9a6a08; --mid-bg:#fbf0d6; --good:#23714a; --good-bg:#e1f2e8;
  --f-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --ink:#e6ebf0; --muted:#97a5b3; --line:#2b3541;
  --accent:#86a2ff; --accent-ink:#0d1320; --accent-soft:#1f2a45;
  --mark:#5c4d0e; --mark-ink:#fff4c2;
  --bad:#f08a7a; --bad-bg:#3a1f1b; --mid:#e8b85a; --mid-bg:#3a2e14; --good:#6fd19c; --good-bg:#16322a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e6ebf0; --muted:#97a5b3; --line:#2b3541;
  --accent:#86a2ff; --accent-ink:#0d1320; --accent-soft:#1f2a45;
  --mark:#5c4d0e; --mark-ink:#fff4c2;
  --bad:#f08a7a; --bad-bg:#3a1f1b; --mid:#e8b85a; --mid-bg:#3a2e14; --good:#6fd19c; --good-bg:#16322a;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-head);font-size:28px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.01em}
h1 small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-top:4px;letter-spacing:0}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tabs .sp{flex:1}
.tabs .kbd-hint{align-self:center;font-size:12px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{min-width:0;flex:1 1 180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent}
.btn.warn{color:var(--bad)}
.spacer{flex:1}

/* index card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:340px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(20,30,50,.35);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:64px;border-top:1.5px solid var(--bad);opacity:.35}
.card-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;height:64px;font-size:13px;color:var(--muted);gap:8px}
.card-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:10px;text-align:center;cursor:pointer;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-position:0 20px}
.hw{font-family:var(--f-head);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.1;word-break:break-word}
.ph{font-family:var(--f-mono);color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px}
.say{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:30px;height:30px;display:inline-grid;place-items:center;padding:0}
.say svg{width:15px;height:15px}
.back{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:56ch}
.mean{font-size:19px;font-weight:500}
.ex{font-family:var(--f-head);font-size:17px;color:var(--muted);font-style:italic}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px;font-style:normal}
.tap{font-size:13px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.rate button{border:0;border-right:1px solid var(--line);background:transparent;padding:14px 8px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button:last-child{border-right:0}
.rate button small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.rate .r1{color:var(--bad)} .rate .r1:hover{background:var(--bad-bg)}
.rate .r2{color:var(--mid)} .rate .r2:hover{background:var(--mid-bg)}
.rate .r3{color:var(--good)} .rate .r3:hover{background:var(--good-bg)}
.flipbtn{border-top:1px solid var(--line)}
.flipbtn button{width:100%;border:0;background:transparent;padding:16px;font-weight:500;color:var(--accent)}

.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;line-height:1.6}
.chip.l2{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.l3{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.chip.new{color:var(--muted)}
.chip.learn{color:var(--mid);background:var(--mid-bg);border-color:transparent}
.chip.done{color:var(--good);background:var(--good-bg);border-color:transparent}
.star{border:0;background:transparent;font-size:18px;line-height:1;color:var(--muted);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--mid)}

.summary{padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.summary h2{font-family:var(--f-head);margin:0;font-size:24px}
.summary .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* quiz */
.q-prompt{padding:30px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.q-prompt .hw{font-size:clamp(30px,7vw,44px)}
.q-prompt .mean{font-size:20px;max-width:40ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px 20px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none;margin-top:2px}
.opt span{min-width:0;word-break:break-word}
.opt.en span{font-family:var(--f-head);font-size:18px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);flex-wrap:wrap}
.q-foot .fb{color:var(--ink);min-width:0}

/* list */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;position:sticky;top:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.w{font-family:var(--f-head);font-weight:700;font-size:17px;white-space:nowrap}
td.p{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
td .exs{display:block;color:var(--muted);font-family:var(--f-head);font-style:italic;font-size:14px}
.count{font-size:13px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20}
footer{font-size:12px;color:var(--muted);line-height:1.7}

@media (max-width:620px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat:nth-child(3){border-right:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .opts{grid-template-columns:1fr}
  .tabs .kbd-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>四级进阶词卡<small>CET-4 大纲中超出高中 3500 词、相对少见的词 · 共 <span id="totalN"></span> 个</small></h1>
  </header>

  <section class="stats" aria-label="学习进度">
    <div class="stat"><b id="sDone">0</b><span>已掌握</span><div class="bar"><i id="sBar"></i></div></div>
    <div class="stat"><b id="sLearn">0</b><span>学习中</span></div>
    <div class="stat"><b id="sDue">0</b><span>现在到期</span></div>
    <div class="stat"><b id="sNew">0</b><span>未学</span></div>
    <div class="stat"><b id="sStar">0</b><span>生词本</span></div>
  </section>

  <nav class="tabs">
    <a href="#cards" data-tab="cards">背词</a>
    <a href="#quiz" data-tab="quiz">测验</a>
    <a href="#list" data-tab="list">词表</a>
    <span class="sp"></span>
    <span class="kbd-hint" id="hint"></span>
  </nav>

  <div class="toolbar" id="scopeBar">
    <label for="scope">范围
      <select id="scope">
        <option value="all">全部词</option>
        <option value="2">常考（四级新增）</option>
        <option value="3">偏难（少见）</option>
        <option value="learn">学习中 / 错词</option>
        <option value="star">生词本</option>
      </select>
    </label>
    <label for="size" id="sizeWrap">每组
      <select id="size"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
    </label>
    <label for="dir" id="dirWrap" hidden>题型
      <select id="dir"><option value="en">看英文选释义</option><option value="zh">看释义选英文</option></select>
    </label>
    <span class="spacer"></span>
    <button class="btn ghost warn" id="reset" type="button">清空进度</button>
  </div>

  <!-- cards -->
  <section id="v-cards" class="card" aria-live="polite">
    <div class="card-top"><span id="cProg"></span><span id="cChips"></span></div>
    <div id="cMain" class="card-body"></div>
    <div id="cFlip" class="flipbtn"><button type="button" id="flip">显示释义 <small>(空格)</small></button></div>
    <div id="cRate" class="rate" hidden>
      <button type="button" class="r1" data-r="1">不认识<small>1 · 稍后再来</small></button>
      <button type="button" class="r2" data-r="2">模糊<small>2 · 明天复习</small></button>
      <button type="button" class="r3" data-r="3">认识<small>3 · 拉长间隔</small></button>
    </div>
  </section>

  <!-- quiz -->
  <section id="v-quiz" class="card" hidden>
    <div class="card-top"><span id="qScore"></span><span id="qChips"></span></div>
    <div class="q-prompt" id="qPrompt"></div>
    <div class="opts" id="qOpts"></div>
    <div class="q-foot"><span class="fb" id="qFb">选一个答案，或按 1–4</span><button class="btn primary" id="qNext" type="button">下一题 ↵</button></div>
  </section>

  <!-- list -->
  <section id="v-list" hidden>
    <div class="toolbar" style="margin-bottom:10px">
      <input type="search" id="q" placeholder="搜索单词或中文释义" aria-label="搜索">
      <label for="lf">状态
        <select id="lf"><option value="all">全部</option><option value="new">未学</option><option value="learn">学习中</option><option value="done">已掌握</option><option value="star">生词本</option></select>
      </label>
      <button class="btn" id="copy" type="button">复制当前词表</button>
      <span class="count" id="lCount"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th style="width:36px"></th><th>单词</th><th>音标</th><th>释义 / 例句</th><th>状态</th></tr></thead>
        <tbody id="lBody"></tbody>
      </table>
    </div>
  </section>

  <footer>
    进度只保存在当前浏览器里。复习间隔：不认识→本组内再出现；模糊→1 天；认识→3、7、15、30 天逐级拉长，连续认识到 7 天档即算“已掌握”。
    “常考 / 偏难”是按出题频率的经验分档，不是官方标注；词表以 2016 版四级大纲中超出高中课标 3500 词的部分为主，个别词各版本归档可能不同。
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const RAW = `abnormal|/æbˈnɔːml/|adj. 反常的，异常的|Abnormal weather has hit the region this year.|2

const WORDS = RAW.trim().split('\n').map(l => { const [w, ph, m, ex, lv] = l.split('|'); return { w, ph, m, ex, lv: +lv }; });
const BY = Object.fromEntries(WORDS.map(x => [x.w, x]));
const KEY = 'cet4-deck-v1', DAY = 864e5, IV = [0, 0, 1, 3, 7, 15, 30];
const $ = id => document.getElementById(id);

let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const rec = w => S[w] || (S[w] = { b: 0, d: 0, x: 0 });
const status = w => { const s = S[w]; return !s || !s.b ? 'new' : s.b >= 4 ? 'done' : 'learn'; };
const STATUS_TXT = { new: '未学', learn: '学习中', done: '已掌握' };
const LV_TXT = { 2: '常考', 3: '偏难' };

function rate(w, r) {
  const s = rec(w), now = Date.now();
  if (r === 1) { s.b = 1; s.x++; s.d = now; }
  else if (r === 2) { s.b = Math.max(2, s.b - 1); s.d = now + IV[s.b] * DAY; }
  else { s.b = s.b ? Math.min(s.b + 1, 6) : 3; s.d = now + IV[s.b] * DAY; }
  save(); stats();
}

const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hl(ex, w) {
  const stem = w.length > 5 ? w.slice(0, w.length - 2) : w.replace(/[ey]$/, '');
  return esc(ex).replace(new RegExp('\\b(' + stem + '\\w*)', 'i'), '<mark>$1</mark>');
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

const canSpeak = 'speechSynthesis' in window;
function speak(w) {
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = w => canSpeak ? `<button type="button" class="say" data-say="${w}" aria-label="朗读 ${w}">${SPK}</button>` : '';

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }

/* stats */
function stats() {
  const now = Date.now(); let done = 0, learn = 0, due = 0, star = 0;
  for (const x of WORDS) { const s = S[x.w]; const st = status(x.w);
    if (st === 'done') done++; else if (st === 'learn') learn++;
    if (s && s.b && s.d <= now) due++; if (s && s.s) star++; }
  $('sDone').textContent = done; $('sLearn').textContent = learn; $('sDue').textContent = due;
  $('sNew').textContent = WORDS.length - done - learn; $('sStar').textContent = star;
  $('sBar').style.width = (done / WORDS.length * 100).toFixed(1) + '%';
}

function pool() {
  const sc = $('scope').value;
  return WORDS.filter(x => sc === 'all' ? true : sc === 'star' ? S[x.w] && S[x.w].s : sc === 'learn' ? status(x.w) === 'learn' : x.lv === +sc);
}

/* ---- cards ---- */
let queue = [], cur = null, again = new Set(), flipped = false, tally = { 1: 0, 2: 0, 3: 0 }, setSize = 0, early = false;

function buildSession(force) {
  const now = Date.now(), p = pool(), n = +$('size').value;
  const due = p.filter(x => S[x.w] && S[x.w].b && S[x.w].d <= now).sort((a, b) => S[a.w].d - S[b.w].d);
  const fresh = shuffle(p.filter(x => status(x.w) === 'new'));
  queue = [...due, ...fresh].slice(0, n);
  early = false;
  if (!queue.length && force) { queue = shuffle(p).slice(0, n); early = true; }
  again = new Set(); tally = { 1: 0, 2: 0, 3: 0 }; setSize = queue.length;
  nextCard();
}

function chipsFor(x) {
  const st = status(x.w), s = S[x.w];
  return `<span class="chip l${x.lv}">${LV_TXT[x.lv]}</span> <span class="chip ${st}">${STATUS_TXT[st]}</span> ` +
    `<button type="button" class="star" data-star="${x.w}" aria-pressed="${!!(s && s.s)}" aria-label="加入生词本">★</button>`;
}

function nextCard() {
  cur = queue.shift() || null; flipped = false;
  $('cRate').hidden = true;
  if (!cur) { renderSummary(); return; }
  $('cFlip').hidden = false;
  $('cProg').textContent = `${early ? '提前复习 · ' : ''}本组剩余 ${queue.length + 1} 张`;
  $('cChips').innerHTML = chipsFor(cur);
  $('cMain').innerHTML = `<div class="hw">${cur.w}</div><div class="ph">${esc(cur.ph)} ${sayBtn(cur.w)}</div><div class="tap">先回想意思，再点卡片翻面</div>`;
}

function flip() {
  if (!cur || flipped) return; flipped = true;
  $('cMain').innerHTML = `<div class="hw">${cur.w}</div><div class="ph">${esc(cur.ph)} ${sayBtn(cur.w)}</div>
    <div class="back"><div class="mean">${esc(cur.m)}</div><div class="ex">${hl(cur.ex, cur.w)}</div></div>`;
  $('cFlip').hidden = true; $('cRate').hidden = false;
}

function answer(r) {
  if (!cur || !flipped) return;
  rate(cur.w, r); tally[r]++;
  if (r === 1) queue.splice(Math.min(3, queue.length), 0, cur);
  else if (r === 2 && !again.has(cur.w)) { again.add(cur.w); queue.splice(Math.min(6, queue.length), 0, cur); }
  nextCard();
}

function renderSummary() {
  $('cFlip').hidden = true; $('cRate').hidden = true; $('cChips').innerHTML = ''; $('cProg').textContent = '';
  const p = pool();
  if (!setSize) {
    const learned = p.filter(x => status(x.w) !== 'new').length;
    $('cMain').innerHTML = `<div class="summary"><h2>这个范围暂时没有要背的词</h2>
      <p>${p.length ? `新词已全部学过，复习也都还没到期（${learned} 个在排期中）。` : '这个范围是空的，先在词表里点 ★ 收藏几个词。'}</p>
      <div class="row">${p.length ? '<button class="btn primary" type="button" data-act="early">提前复习一组</button>' : ''}
      <button class="btn" type="button" data-act="all">切到全部词</button></div></div>`;
    return;
  }
  $('cMain').innerHTML = `<div class="summary"><h2>这一组完成了</h2>
    <p>${setSize} 个词 · 认识 ${tally[3]} 次 · 模糊 ${tally[2]} 次 · 不认识 ${tally[1]} 次</p>
    <div class="row"><button class="btn primary" type="button" data-act="more">再来一组</button>
    <a class="btn" href="#quiz" style="text-decoration:none">去测验巩固</a></div></div>`;
  setSize = 0;
}

$('cMain').addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { e.stopPropagation(); const v = a.dataset.act;
    if (v === 'all') { $('scope').value = 'all'; buildSession(); }
    else buildSession(v === 'early'); return; }
  if (e.target.closest('.say')) return;
  if (cur) flip();
});
$('flip').addEventListener('click', flip);
$('cRate').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) answer(+b.dataset.r); });

/* ---- quiz ---- */
let qAns = null, qDone = false, qRight = 0, qTotal = 0, qOpts = [];
function nextQ() {
  let p = pool(); if (!p.length) p = WORDS;
  qAns = p[Math.random() * p.length | 0]; qDone = false;
  const others = shuffle(WORDS.filter(x => x.w !== qAns.w && x.m !== qAns.m)).slice(0, 3);
  qOpts = shuffle([qAns, ...others]);
  const zh = $('dir').value === 'zh';
  $('qChips').innerHTML = chipsFor(qAns);
  $('qPrompt').innerHTML = zh ? `<div class="mean">${esc(qAns.m)}</div>` : `<div class="hw">${qAns.w}</div><div class="ph">${esc(qAns.ph)} ${sayBtn(qAns.w)}</div>`;
  $('qOpts').innerHTML = qOpts.map((o, i) => `<button type="button" class="opt ${zh ? 'en' : ''}" data-i="${i}"><kbd>${i + 1}</kbd><span>${zh ? o.w : esc(o.m)}</span></button>`).join('');
  $('qFb').textContent = '选一个答案，或按 1–4';
  $('qScore').textContent = qTotal ? `本轮 ${qRight}/${qTotal} 正确` : '本轮还没答题';
}
function choose(i) {
  if (qDone || !qOpts[i]) return; qDone = true; qTotal++;
  const ok = qOpts[i] === qAns, btns = $('qOpts').querySelectorAll('.opt');
  btns.forEach((b, j) => { b.disabled = true; if (qOpts[j] === qAns) b.classList.add('right'); });
  if (ok) { qRight++; $('qFb').innerHTML = `答对了 · <span style="font-family:var(--f-head);font-style:italic">${hl(qAns.ex, qAns.w)}</span>`; }
  else { btns[i].classList.add('wrong'); rate(qAns.w, 1);
    $('qFb').innerHTML = `<b>${qAns.w}</b> ${esc(qAns.m)} · 已加入“学习中 / 错词”`; }
  $('qScore').textContent = `本轮 ${qRight}/${qTotal} 正确`;
  $('qChips').innerHTML = chipsFor(qAns);
  if (canSpeak && $('dir').value === 'zh') speak(qAns.w);
}
$('qOpts').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) choose(+b.dataset.i); });
$('qNext').addEventListener('click', nextQ);
$('dir').addEventListener('change', nextQ);

/* ---- list ---- */
let listRows = [];
function renderList() {
  const q = $('q').value.trim().toLowerCase(), f = $('lf').value, sc = $('scope').value;
  const base = pool();
  listRows = base.filter(x => (!q || x.w.includes(q) || x.m.includes(q)) &&
    (f === 'all' || (f === 'star' ? S[x.w] && S[x.w].s : status(x.w) === f)));
  $('lCount').textContent = `${listRows.length} / ${WORDS.length} 词`;
  $('lBody').innerHTML = listRows.length ? listRows.map(x => { const st = status(x.w), s = S[x.w];
    return `<tr><td><button type="button" class="star" data-star="${x.w}" aria-pressed="${!!(s && s.s)}" aria-label="收藏 ${x.w}">★</button></td>
      <td class="w">${x.w} ${sayBtn(x.w)}</td><td class="p">${esc(x.ph)}</td>
      <td>${esc(x.m)}<span class="exs">${hl(x.ex, x.w)}</span></td>
      <td><span class="chip l${x.lv}">${LV_TXT[x.lv]}</span><br><span class="chip ${st}">${STATUS_TXT[st]}</span></td></tr>`; }).join('')
    : `<tr><td colspan="5" class="empty">没有符合条件的词。换个关键词，或把上面的“范围”改回全部词。</td></tr>`;
}
$('q').addEventListener('input', renderList);
$('lf').addEventListener('change', renderList);
$('copy').addEventListener('click', () => {
  const text = listRows.map(x => [x.w, x.ph, x.m, x.ex].join('\t')).join('\n');
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); toast(ok ? `已复制 ${listRows.length} 个词` : '复制失败，请换个浏览器再试'); };
  try { navigator.clipboard.writeText(text).then(() => toast(`已复制 ${listRows.length} 个词（可直接粘到表格）`), fallback); } catch (e) { fallback(); }
});

/* ---- shared ---- */
document.addEventListener('click', e => {
  const sp = e.target.closest('[data-say]'); if (sp) { e.stopPropagation(); speak(sp.dataset.say); return; }
  const st = e.target.closest('[data-star]');
  if (st) { e.stopPropagation(); const s = rec(st.dataset.star); s.s = !s.s; save(); stats();
    document.querySelectorAll(`[data-star="${st.dataset.star}"]`).forEach(b => b.setAttribute('aria-pressed', s.s));
    toast(s.s ? '已加入生词本' : '已移出生词本'); }
}, true);

let resetArm = 0;
$('reset').addEventListener('click', () => {
  if (Date.now() - resetArm < 3000) { S = {}; save(); stats(); resetArm = 0; $('reset').textContent = '清空进度'; toast('进度已清空'); refresh(); return; }
  resetArm = Date.now(); $('reset').textContent = '再点一次确认清空';
  setTimeout(() => { if (resetArm && Date.now() - resetArm >= 3000) { $('reset').textContent = '清空进度'; resetArm = 0; } }, 3100);
});

let tab = 'cards';
const HINTS = { cards: '空格 翻面 · 1/2/3 评分 · P 发音', quiz: '1–4 选择 · Enter 下一题 · P 发音', list: '' };
function refresh() { if (tab === 'cards') buildSession(); else if (tab === 'quiz') nextQ(); else renderList(); }
function route() {
  const h = location.hash.slice(1); tab = ['cards', 'quiz', 'list'].includes(h) ? h : 'cards';
  document.querySelectorAll('.tabs a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('v-cards').hidden = tab !== 'cards'; $('v-quiz').hidden = tab !== 'quiz'; $('v-list').hidden = tab !== 'list';
  $('sizeWrap').hidden = tab !== 'cards'; $('dirWrap').hidden = tab !== 'quiz';
  $('hint').textContent = HINTS[tab];
  refresh();
}
window.addEventListener('hashchange', route);
$('scope').addEventListener('change', refresh);
$('size').addEventListener('change', () => tab === 'cards' && buildSession());

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (tab === 'cards') {
    if ((k === ' ' || k === 'enter') && cur && !flipped) { e.preventDefault(); flip(); }
    else if (['1', '2', '3'].includes(k)) answer(+k);
    else if (k === 'p' && cur) speak(cur.w);
  } else if (tab === 'quiz') {
    if (['1', '2', '3', '4'].includes(k)) choose(+k - 1);
    else if (k === 'enter' && qDone) { e.preventDefault(); nextQ(); }
    else if (k === 'p' && qAns) speak(qAns.w);
  }
});

$('totalN').textContent = WORDS.length;
stats(); route();
</script>
</body>
</html>
